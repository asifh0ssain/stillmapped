[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "stillmapped"
version = "0.1.6"  # released 2026-11-04; equals stillmapped.__version__
description = "Is the PHP or OpenSSL code running in memory fixed? Read-only, offline, vendor-aware CVE fix resolver."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Asif Hossain" }]
dependencies = []

[project.scripts]
stillmapped = "stillmapped.cli:main"

[tool.setuptools]
packages = ["stillmapped"]

[tool.setuptools.package-data]
stillmapped = ["data/*.json"]
