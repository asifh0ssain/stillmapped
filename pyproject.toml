[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "stillmapped"
dynamic = ["version"]
description = "Is this PHP build fixed? Read-only, offline, vendor-aware CVE fix resolver."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Asif Hossain" }]
dependencies = []

[project.scripts]
stillmapped = "stillmapped.cli:main"

[tool.setuptools]
packages = ["stillmapped"]

[tool.setuptools.dynamic]
version = { attr = "stillmapped.__version__" }

[tool.setuptools.package-data]
stillmapped = ["data/*.json"]
