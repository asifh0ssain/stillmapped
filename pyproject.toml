[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phpfixed"
dynamic = ["version"]
description = "Is this PHP build fixed? Read-only, offline, vendor-aware CVE fix resolver."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [{ name = "Asif Hossain" }]
dependencies = []

[project.scripts]
phpfixed = "phpfixed.cli:main"

[tool.setuptools.dynamic]
version = { attr = "phpfixed.__version__" }

[tool.setuptools.package-data]
phpfixed = ["data/*.json"]
